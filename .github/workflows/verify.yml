name: Verify public distribution
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python -c "from pathlib import Path; Path('design').mkdir(exist_ok=True)"
      - run: python -m unittest discover -s tests -v
        env:
          TERM: xterm-256color
          TERM_PROGRAM: Apple_Terminal
      - run: python scripts/build-release.py
      - run: python scripts/check-release.py
      - name: Extract complete distribution outside checkout
        run: python -m zipfile -e dist/dsh-control-windows.zip "${{ runner.temp }}/dsh extracted package"
      - name: Install through Windows user entry
        if: runner.os == 'Windows'
        env:
          DSH_CONTROL_NO_PAUSE: "1"
        run: '& "${{ runner.temp }}/dsh extracted package/Install DSH Control.cmd" --app-dir "${{ runner.temp }}/dsh-control/app" --bin-dir "${{ runner.temp }}/dsh-control/bin" --no-path --control-only'
      - name: Install through POSIX user entry
        if: runner.os != 'Windows'
        run: sh "${{ runner.temp }}/dsh extracted package/install.sh" --app-dir "${{ runner.temp }}/dsh-control/app" --bin-dir "${{ runner.temp }}/dsh-control/bin" --no-path --control-only
  release:
    name: Publish verified release
    needs: test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python scripts/build-release.py
      - name: Check tag, notes, installer URLs and files
        run: python scripts/check-release.py --tag "$RELEASE_TAG"
      - name: Create draft, verify uploads and publish
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json isDraft > "$RUNNER_TEMP/existing-release.json" 2>/dev/null; then
            if jq -e '.isDraft == false' "$RUNNER_TEMP/existing-release.json" >/dev/null; then
              echo "Release is already public; leaving its files unchanged."
              exit 0
            fi
          else
            gh release create "$RELEASE_TAG" \
              dist/dsh-control-windows.zip dist/dsh-control-macos.zip dist/dsh-control-linux.zip \
              --verify-tag --draft --title "DSH Control $RELEASE_TAG" \
              --notes-file assets/RELEASE_NOTES.md
          fi
          # The tag endpoint excludes unpublished drafts; resolve the release ID.
          release_id=$(gh release view "$RELEASE_TAG" --json databaseId --jq .databaseId)
          gh api "repos/$GH_REPO/releases/$release_id" > "$RUNNER_TEMP/release-assets.json"
          python scripts/check-release.py --tag "$RELEASE_TAG" --published-assets "$RUNNER_TEMP/release-assets.json"
          gh release edit "$RELEASE_TAG" --draft=false --latest
