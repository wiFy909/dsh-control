<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="310" viewBox="0 0 1080 310" role="img" aria-label="操作顺序：打开、进入、启动网页、停止后退出"><title>操作顺序：打开、进入、启动网页、停止后退出</title><style>text{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans CJK SC,Microsoft YaHei,sans-serif}</style><rect width="1080" height="310" rx="22" fill="#081322"/><text x="38" y="57" font-size="28" fill="#edf4ff" font-weight="650">从第一次打开，到每天使用</text><rect x="35" y="92" width="230" height="137" rx="14" fill="#13253b" stroke="#2e4d70"/><text x="54" y="123" font-size="16" fill="#87b8f6" font-weight="400">01</text><text x="54" y="160" font-size="20" fill="#dfebfc" font-weight="600">打开控制台</text><text x="54" y="200" font-size="16" fill="#9ebada" font-weight="400">dsh-control</text><text x="281" y="164" font-size="24" fill="#5a7da7" font-weight="400">›</text><rect x="295" y="92" width="230" height="137" rx="14" fill="#13253b" stroke="#2e4d70"/><text x="314" y="123" font-size="16" fill="#87b8f6" font-weight="400">02</text><text x="314" y="160" font-size="20" fill="#dfebfc" font-weight="600">进入平台或控制台</text><text x="314" y="200" font-size="16" fill="#9ebada" font-weight="400">Enter / Space / 左键</text><text x="541" y="164" font-size="24" fill="#5a7da7" font-weight="400">›</text><rect x="555" y="92" width="230" height="137" rx="14" fill="#13253b" stroke="#2e4d70"/><text x="574" y="123" font-size="16" fill="#87b8f6" font-weight="400">03</text><text x="574" y="160" font-size="20" fill="#dfebfc" font-weight="600">启动并打开网页</text><text x="574" y="200" font-size="16" fill="#9ebada" font-weight="400">1 启动</text><text x="801" y="164" font-size="24" fill="#5a7da7" font-weight="400">›</text><rect x="801" y="92" width="230" height="137" rx="14" fill="#13253b" stroke="#2e4d70"/><text x="834" y="123" font-size="16" fill="#87b8f6" font-weight="400">04</text><text x="834" y="160" font-size="20" fill="#dfebfc" font-weight="600">用完后停止、退出</text><text x="834" y="200" font-size="16" fill="#9ebada" font-weight="400">2 停止 → 6 退出</text><text x="38" y="272" font-size="17" fill="#8ba9cd" font-weight="400">首次使用先完成平台安装；已有有效绑定会直接进入控制台。</text></svg>