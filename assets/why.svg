<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="402" viewBox="0 0 1080 402" role="img" aria-label="三个常见问题：服务状态、用量花费、版本更新"><title>三个常见问题：服务状态、用量花费、版本更新</title><style>text{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans CJK SC,Microsoft YaHei,sans-serif}</style><rect width="1080" height="402" rx="22" fill="#081322"/><text x="38" y="55" font-size="28" fill="#edf4ff" font-weight="650">少记命令，把注意力放回任务。</text><rect x="36" y="88" width="324" height="280" rx="16" fill="#101f33" stroke="#284361"/><text x="60" y="128" font-size="17" fill="#7facdf" font-weight="600">01</text><text x="60" y="174" font-size="25" fill="#dceaff" font-weight="600">服务状态，看得见</text><text x="60" y="211" font-size="17" fill="#839bb9" font-weight="400">窗口关了，服务还在运行？</text><path d="M60 235h276" stroke="#2a4564"/><text x="60" y="278" font-size="16" fill="#bad0ea" font-weight="400">启动、停止、重开网页集中操作。</text><text x="60" y="310" font-size="16" fill="#bad0ea" font-weight="400">实时检查进程与网页是否就绪。</text><rect x="378" y="88" width="324" height="280" rx="16" fill="#101f33" stroke="#284361"/><text x="402" y="128" font-size="17" fill="#7facdf" font-weight="600">02</text><text x="402" y="174" font-size="25" fill="#dceaff" font-weight="600">用量花费，有依据</text><text x="402" y="211" font-size="17" fill="#839bb9" font-weight="400">只看余额，不知道用在哪？</text><path d="M402 235h276" stroke="#2a4564"/><text x="402" y="278" font-size="16" fill="#bad0ea" font-weight="400">读取本机日志，汇总今日与七日。</text><text x="402" y="310" font-size="16" fill="#bad0ea" font-weight="400">金额标注估算，缺失记录不冒充零。</text><rect x="720" y="88" width="324" height="280" rx="16" fill="#101f33" stroke="#284361"/><text x="744" y="128" font-size="17" fill="#7facdf" font-weight="600">03</text><text x="744" y="174" font-size="25" fill="#dceaff" font-weight="600">更新版本，有步骤</text><text x="744" y="211" font-size="17" fill="#839bb9" font-weight="400">升级后，会话和 Key 怎么办？</text><path d="M744 235h276" stroke="#2a4564"/><text x="744" y="278" font-size="16" fill="#bad0ea" font-weight="400">查询官方版本，给出对应命令。</text><text x="744" y="310" font-size="16" fill="#bad0ea" font-weight="400">沿用已绑定的数据目录与配置。</text><g fill="none" stroke="#81ade0" stroke-width="2" stroke-linecap="round"><rect x="286" y="108" width="46" height="30" rx="5"/><path d="M292 126h9l5-9 6 15 5-6h9"/><path d="M628 137v-11m10 11v-23m10 23v-17m10 17v-31"/><path d="M978 116a17 17 0 0 1 29 6m-29 6a17 17 0 0 0 29 6m-7-20 7 8 2-10m-22 29-9-7-1 10"/></g></svg>